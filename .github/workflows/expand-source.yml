name: Expand v0.5 source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack original project into repository
        run: |
          mkdir staging
          unzip -q source.zip -d staging
          rsync -a --exclude=.github/ staging/ ./
          rm -rf staging
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Expand v0.5 Action Center source [skip ci]"
            git push
          fi
